name: Ingest

on:
  schedule:
    - cron: "17 11 * * *" # 11:17 UTC = 6:17 a. m. en Bogota
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked

      - name: Extract
        run: uv run python src/extract.py

      - name: Transform
        run: uv run python src/transform.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: snapshot $(date -u +%F)"
          git push
